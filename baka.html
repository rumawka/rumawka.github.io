<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
/>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="default"
/>

<meta
  name="apple-mobile-web-app-title"
  content="BAKAI"
/>

<title>BAKAI - Чек</title>

<style>

  :root {
    --bg: #f0f0f0;
    --card: #ffffff;

    --text: #0b1e3d;
    --muted: #8c97a6;

    --line: #d4d8de;

    --blue: #1a7cf8;
    --share-bg: #e4ecf8;

    --green: #28cc60;
    --green-ring: rgba(40,204,96,0.22);

    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }


  * {
    box-sizing: border-box;

    margin: 0;
    padding: 0;

    -webkit-tap-highlight-color: transparent;
  }


  html {
    width: 100%;
    min-height: 100%;

    background: var(--bg);

    -webkit-text-size-adjust: 100%;
  }


  body {
    width: 100%;
    min-width: 0;
    min-height: 100%;

    margin: 0;

    background: var(--bg);
    color: var(--text);

    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "SF Pro Display",
      "SF Pro Text",
      "Helvetica Neue",
      Arial,
      sans-serif;

    overflow-x: hidden;

    -webkit-font-smoothing: antialiased;

    overscroll-behavior-x: none;
  }


  button,
  input {
    font: inherit;
  }


  button {
    border: none;

    cursor: pointer;

    -webkit-appearance: none;
    appearance: none;
  }


  input {
    -webkit-appearance: none;
    appearance: none;
  }


  /* =========================================================
     COMMON
  ========================================================= */

  .screen {
    width: 100%;

    min-height: 100svh;
    min-height: 100dvh;

    background: var(--bg);
  }


  .phone-shell {
    width: 100%;
    max-width: 430px;

    min-height: 100svh;
    min-height: 100dvh;

    margin: 0 auto;

    padding-left: var(--safe-left);
    padding-right: var(--safe-right);

    display: flex;
    flex-direction: column;
  }


  /* =========================================================
     TOP BAR
  ========================================================= */

  .top-bar {
    position: relative;

    width: 100%;

    min-height: 108px;

    flex: 0 0 108px;

    display: flex;
    align-items: flex-end;
    justify-content: center;

    padding-top: calc(var(--safe-top) + 14px);
    padding-bottom: 17px;

    padding-left: 16px;
    padding-right: 16px;
  }


  .logo {
    width: 164px;

    height: auto;

    display: block;
  }


  .back-btn {
    position: absolute;

    left: 16px;
    bottom: 15px;

    width: 56px;
    height: 56px;

    border-radius: 50%;

    background: #fff;

    color: var(--text);

    display: grid;
    place-items: center;

    box-shadow:
      0 1px 4px rgba(15,37,65,.04);
  }


  .back-btn svg {
    width: 27px;
    height: 27px;
  }


  /* =========================================================
     RECEIPT
  ========================================================= */

  .receipt-shell {
    min-height: 100svh;
    min-height: 100dvh;

    display: flex;
    flex-direction: column;
  }


  .receipt-body {
    flex: 1;

    min-height: 0;

    display: flex;
    flex-direction: column;

    padding: 47px 12px 0;
  }


  .receipt-card {
    position: relative;

    width: 100%;

    background: var(--card);

    border-radius: 26px;

    overflow: hidden;

    box-shadow:
      0 2px 10px rgba(18,40,65,.025);

    flex-shrink: 0;
  }


  /* =========================================================
     RECEIPT TOP
  ========================================================= */

  .receipt-top {
    text-align: center;

    padding: 23px 24px 8px;
  }


  /* GREEN SUCCESS CIRCLE */

  .status-circle {
    width: 106px;
    height: 106px;

    margin: 0 auto 17px;

    border-radius: 50%;

    background: var(--green);

    border: 7px solid var(--green-ring);

    display: grid;
    place-items: center;
  }


  .status-circle svg {
    width: 54px;
    height: 54px;

    stroke: #ffffff;

    stroke-width: 3.3;

    fill: none;

    stroke-linecap: round;
    stroke-linejoin: round;
  }


  .status-text {
    font-size: 31px;

    line-height: 1.05;

    font-weight: 500;

    letter-spacing: -0.035em;

    margin-bottom: 25px;
  }


  /* =========================================================
     AMOUNT
  ========================================================= */

  .amount-row {
    display: flex;

    align-items: baseline;
    justify-content: center;

    gap: 8px;

    margin-bottom: 24px;
  }


  .amount {
    font-size: 61px;

    line-height: .9;

    font-weight: 750;

    letter-spacing: -0.055em;
  }


  .currency {
    position: relative;

    top: 2px;

    font-size: 40px;

    line-height: 1;

    color: #617183;

    text-decoration: underline;

    text-underline-offset: 5px;

    font-weight: 400;
  }


  /* =========================================================
     FEE
  ========================================================= */

  .fee-row {
    font-size: 28px;

    line-height: 1;

    color: #7b8998;

    margin-bottom: 2px;

    letter-spacing: -0.025em;
  }


  .fee-row strong {
    font-weight: 500;

    color: #68788a;
  }


  .fee-currency {
    text-decoration: underline;

    text-underline-offset: 3px;
  }


  /* =========================================================
     TICKET TEAR
  ========================================================= */

  .tear-row {
    position: relative;

    height: 37px;

    display: flex;
    align-items: center;

    overflow: visible;
  }


  .tear-line {
    flex: 1;

    height: 3px;

    margin: 0 30px;

    background:
      repeating-linear-gradient(
        90deg,
        #e2e6e9 0,
        #e2e6e9 11px,
        transparent 11px,
        transparent 20px
      );
  }


  .tear-cut {
    position: absolute;

    top: 50%;

    width: 74px;
    height: 74px;

    background: var(--bg);

    border-radius: 50%;

    transform: translateY(-50%);

    z-index: 2;
  }


  .tear-cut.left {
    left: -37px;
  }


  .tear-cut.right {
    right: -37px;
  }


  /* =========================================================
     RECEIPT BOTTOM
  ========================================================= */

  .receipt-bottom {
    text-align: center;

    padding: 11px 20px 24px;
  }


  .trx-number {
    font-size: 31px;

    line-height: 1.05;

    font-weight: 500;

    margin-bottom: 15px;

    letter-spacing: -0.03em;
  }


  .trx-source {
    font-size: 27px;

    line-height: 1.05;

    font-weight: 500;

    margin-bottom: 18px;

    letter-spacing: -0.035em;
  }


  .trx-date {
    font-size: 25px;

    line-height: 1.05;

    color: #748496;

    font-weight: 400;

    letter-spacing: -0.025em;
  }


  /* =========================================================
     TRANSACTION DETAILS
  ========================================================= */

  .details-wrap {
    display: flex;

    justify-content: center;

    padding: 30px 0 44px;

    flex-shrink: 0;
  }


  .details-btn {
    min-height: 68px;

    padding: 0 31px;

    border-radius: 999px;

    background: #fff;

    color: var(--text);

    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 15px;

    font-size: 24px;

    font-weight: 500;

    box-shadow:
      0 2px 8px rgba(18,40,65,.035);
  }


  .details-btn svg {
    width: 23px;
    height: 23px;

    color: #c8d0d9;
  }


  /* =========================================================
     UFC BANNER
  ========================================================= */

  .banner-wrap {
    width: 100%;

    overflow: hidden;

    border-radius: 20px;

    flex-shrink: 0;
  }


  .banner {
    display: block;

    width: 100%;
    height: auto;

    border-radius: 20px;
  }


  /* =========================================================
     SPACE
  ========================================================= */

  .receipt-spacer {
    flex: 1;

    min-height: 80px;
  }


  /* =========================================================
     BOTTOM BAR
  ========================================================= */

  .bottom-bar {
    flex-shrink: 0;

    width: 100%;

    padding:
      0
      14px
      calc(var(--safe-bottom) + 25px);
  }


  .bottom-bar-inner {
    display: flex;

    gap: 12px;

    align-items: center;
  }


  .home-btn {
    flex: 1;

    height: 72px;

    border-radius: 21px;

    background:
      linear-gradient(
        180deg,
        #1789ff 0%,
        #0876ed 100%
      );

    color: #fff;

    font-size: 24px;

    font-weight: 600;

    box-shadow:
      0 6px 18px rgba(8,118,237,.27);
  }


  .share-btn {
    width: 72px;
    height: 72px;

    flex-shrink: 0;

    border-radius: 21px;

    background: var(--share-bg);

    display: grid;
    place-items: center;
  }


  .share-btn svg {
    width: 31px;
    height: 31px;

    stroke: #087cf5;

    stroke-width: 2.2;

    fill: none;

    stroke-linecap: round;
    stroke-linejoin: round;
  }


  /* =========================================================
     EDITOR
  ========================================================= */

  .edit-shell {
    display: flex;
    flex-direction: column;

    min-height: 100svh;
    min-height: 100dvh;

    padding-bottom:
      calc(var(--safe-bottom) + 24px);
  }


  .edit-panel {
    margin: 8px 12px 0;

    background: #fff;

    border-radius: 24px;

    padding: 20px 18px 22px;
  }


  .editor-title {
    font-size: 24px;

    font-weight: 700;

    margin-bottom: 4px;

    letter-spacing: -0.02em;

    color: var(--text);
  }


  .editor-subtitle {
    font-size: 14px;

    line-height: 1.45;

    color: #7a8794;

    margin-bottom: 20px;
  }


  .field {
    margin-bottom: 14px;
  }


  .field:last-of-type {
    margin-bottom: 0;
  }


  .field label {
    display: block;

    margin-bottom: 7px;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 0.06em;

    text-transform: uppercase;

    color: #8090a0;
  }


  .field input {
    width: 100%;

    min-height: 52px;

    padding: 0 16px;

    border: 1.5px solid #e7eaf0;

    border-radius: 16px;

    background: #fbfcfd;

    color: var(--text);

    font-size: 18px;

    outline: none;

    font-family: inherit;

    transition:
      border-color .15s,
      box-shadow .15s;
  }


  .field input:focus {
    border-color: #8dbdff;

    background: #fff;

    box-shadow:
      0 0 0 4px rgba(10,132,255,.10);
  }


  .editor-actions {
    padding: 16px 12px 8px;
  }


  .generate-btn {
    width: 100%;

    min-height: 58px;

    border-radius: 20px;

    background: #0d2645;

    color: #fff;

    font-size: 18px;

    font-weight: 600;

    font-family: inherit;

    letter-spacing: -0.01em;
  }


  .generate-btn:active {
    opacity: .88;
  }


  .preview-note {
    padding: 0 14px 24px;

    font-size: 13px;

    line-height: 1.45;

    color: #9aa3ae;

    text-align: center;
  }


  /* =========================================================
     IPHONE / SAFE AREA
  ========================================================= */

  @media (max-width: 430px) {

    .phone-shell {
      max-width: 430px;
    }

  }


  /*
    Короткие iPhone.
    Уменьшаем только вертикальные промежутки.
    Размеры шрифтов и основных элементов НЕ трогаем.
  */

  @media (max-height: 780px) {

    .receipt-body {
      padding-top: 28px;
    }

    .details-wrap {
      padding-top: 22px;
      padding-bottom: 28px;
    }

    .receipt-spacer {
      min-height: 50px;
    }

  }


  /*
    Очень короткий экран.
    Например iPhone SE / маленькое окно браузера.
  */

  @media (max-height: 700px) {

    .top-bar {
      min-height: 92px;

      flex-basis: 92px;

      padding-top:
        calc(var(--safe-top) + 8px);

      padding-bottom: 12px;
    }


    .receipt-body {
      padding-top: 14px;
    }


    .details-wrap {
      padding-top: 16px;
      padding-bottom: 20px;
    }


    .receipt-spacer {
      min-height: 30px;
    }


    .bottom-bar {
      padding-bottom:
        calc(var(--safe-bottom) + 16px);
    }

  }


  /*
    Узкие устройства.
    Только горизонтальные отступы.
  */

  @media (max-width: 380px) {

    .top-bar {
      padding-left: 12px;
      padding-right: 12px;
    }


    .back-btn {
      left: 12px;
    }


    .receipt-body {
      padding-left: 10px;
      padding-right: 10px;
    }


    .receipt-top {
      padding-left: 18px;
      padding-right: 18px;
    }


    .receipt-bottom {
      padding-left: 16px;
      padding-right: 16px;
    }


    .bottom-bar {
      padding-left: 10px;
      padding-right: 10px;
    }

  }


  /*
    Landscape.
  */

  @media
  (orientation: landscape)
  and (max-height: 500px) {

    .top-bar {
      min-height: 70px;

      flex-basis: 70px;

      padding-top:
        calc(var(--safe-top) + 4px);

      padding-bottom: 6px;
    }


    .receipt-body {
      padding-top: 8px;
    }


    .receipt-spacer {
      min-height: 20px;
    }


    .bottom-bar {
      padding-bottom:
        calc(var(--safe-bottom) + 10px);
    }

  }

</style>
</head>

      </svg>

    </div>


    <div class="edit-panel">

      <div class="editor-title">
        Редактор чека
      </div>


      <div class="editor-subtitle">
        Заполните данные и нажмите кнопку ниже для формирования чека.
      </div>


      <div class="field">

        <label for="inp-num">
          Номер транзакции
        </label>

        <input
          id="inp-num"
          type="text"
          inputmode="numeric"
          value="154"
        />

      </div>


      <div class="field">

        <label for="inp-sum">
          Сумма
        </label>

        <input
          id="inp-sum"
          type="text"
          inputmode="decimal"

        />

      <div class="field">

        <label for="inp-date">
          Дата и время

        <input
          id="inp-date"
          type="text"

          readonly
        />

    <div class="editor-actions">

      <button
        class="generate-btn"
        type="button"
        onclick="generateReceipt()"
      >
        Сформировать чек
      </button>

    </div>


    <div class="preview-note">
      Для полноэкранного вида на iPhone открывайте со страницы «На экран Домой».

<script>


  function getCurrentDateTime() {

    const now = new Date();

    const pad = n =>
      String(n).padStart(2, '0');

    return (
      `${pad(now.getDate())}.` +
      `${pad(now.getMonth() + 1)}.` +
      `${now.getFullYear()} ` +
      `${pad(now.getHours())}:` +
      `${pad(now.getMinutes())}:` +
      `${pad(now.getSeconds())}`
    );

  }


  function sanitize(value, fallback) {

    const t =
      String(value || '').trim();

    return (
      t === '' ||
      t === 'Автоматически'
    )
      ? fallback
      : t;

  }


  function generateReceipt() {

    const number =
      sanitize(
        document.getElementById('inp-num').value,
        '154'
      );


    const sum =
      sanitize(
        document.getElementById('inp-sum').value,
        '17'
      );


    document.getElementById('out-num').textContent =
      number;


    document.getElementById('out-qr').textContent =
      number;


    document.getElementById('out-sum').textContent =
      sum;


    document.getElementById('out-date').textContent =
      getCurrentDateTime();


    document.getElementById('editor-screen').style.display =
      'none';


    document.getElementById('receipt-screen').style.display =
      'block';


    window.scrollTo(0, 0);

  }


  function backToEditor() {

    document.getElementById('receipt-screen').style.display =
      'none';


    document.getElementById('editor-screen').style.display =
      'block';


    window.scrollTo(0, 0);

  }


</script>
