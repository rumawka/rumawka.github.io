<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="BAKAI" />
<title>Демонстрационный макет чека — BAKAI</title>
<style>
  :root {
    --bg: #f0f0f0;
    --card: #ffffff;
    --text: #0b1e3d;
    --muted: #8c97a6;
    --line: #d4d8de;
    --blue: #1a7cf8;
    --share-bg: #e4ecf8;
    --green: #28cc60;
    --green-ring: rgba(40,204,96,0.22);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    margin: 0;
    padding: 0;
  }

  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    overflow-x: hidden;
    touch-action: none;
    -webkit-font-smoothing: antialiased;
  }

  .screen {
    width: 100%;
    min-height: 100svh;
    background: var(--bg);
  }

  .phone-shell {
    width: 100%;
    max-width: 430px;
    min-height: 100svh;
    margin: 0 auto;
    padding-left: var(--safe-left);
    padding-right: var(--safe-right);
    display: flex;
    flex-direction: column;
  }

  /* ─── TOP BAR ─── */
  .top-bar {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: calc(var(--safe-top) + 14px);
    padding-bottom: 10px;
    padding-left: 16px;
    padding-right: 16px;
    flex-shrink: 0;
  }

  .back-btn {
    position: absolute;
    left: 16px;
    bottom: 10px;
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 999px;
    background: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #1a2738;
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,0.10);
  }

  .back-btn svg {
    width: 20px;
    height: 20px;
  }

  .logo {
    width: 92px;
    height: auto;
    display: block;
  }

  /* ─── RECEIPT SCREEN ─── */
  .receipt-shell {
    display: flex;
    flex-direction: column;
    min-height: 100svh;
  }

  .receipt-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 6px 12px 0;
  }

  /* Card */
  .receipt-card {
    background: var(--card);
    border-radius: 26px;
    overflow: hidden;
    flex-shrink: 0;
  }

  .receipt-top {
    text-align: center;
    padding: 28px 24px 6px;
  }

  .status-circle {
    width: 66px;
    height: 66px;
    margin: 0 auto 12px;
    border-radius: 999px;
    background: var(--green);
    box-shadow: 0 0 0 8px var(--green-ring);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .status-circle svg {
    width: 30px;
    height: 30px;
    stroke: #fff;
    stroke-width: 3;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .status-text {
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 12px;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .amount-row {
    display: inline-flex;
    align-items: baseline;
    justify-content: center;
    gap: 5px;
    margin-bottom: 10px;
  }

  .amount {
    font-size: 44px;
    line-height: 1;
    font-weight: 700;
    letter-spacing: -0.04em;
    color: var(--text);
  }

  .currency {
    font-size: 28px;
    line-height: 1;
    font-weight: 400;
    color: #8c9aac;
    text-decoration: underline;
    text-underline-offset: 3px;
    position: relative;
    top: 2px;
  }

  .fee-row {
    font-size: 14px;
    color: #a0aab5;
    margin-bottom: 6px;
    font-weight: 400;
  }

  .fee-row .fee-currency {
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  /* Tear */
  .tear-row {
    position: relative;
    height: 30px;
    display: flex;
    align-items: center;
    overflow: visible;
    margin-top: 4px;
  }

  .tear-line {
    flex: 1;
    height: 1.5px;
    margin: 0 32px;
    background-image: repeating-linear-gradient(
      90deg,
      var(--line) 0,
      var(--line) 8px,
      transparent 8px,
      transparent 18px
    );
  }

  .tear-cut {
    position: absolute;
    top: 50%;
    width: 56px;
    height: 56px;
    background: var(--bg);
    border-radius: 999px;
    transform: translateY(-50%);
    z-index: 2;
  }

  .tear-cut.left  { left: -28px; }
  .tear-cut.right { right: -28px; }

  /* Receipt bottom */
  .receipt-bottom {
    text-align: center;
    padding: 10px 24px 24px;
  }

  .trx-number {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 5px;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  .trx-source {
    font-size: 16px;
    font-weight: 500;
    margin-bottom: 6px;
    color: var(--text);
  }

  .trx-date {
    font-size: 14px;
    color: #9aa3af;
    font-weight: 400;
  }

  /* Details button */
  .details-wrap {
    display: flex;
    justify-content: center;
    padding: 14px 0 16px;
    flex-shrink: 0;
  }

  .details-btn {
    min-height: 44px;
    padding: 0 22px;
    border: none;
    border-radius: 999px;
    background: #fff;
    color: #1e2c3e;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,0.07);
  }

  .details-btn svg {
    width: 14px;
    height: 14px;
    color: #a2aab4;
    flex-shrink: 0;
  }

  /* Banner */
  .banner-wrap {
    flex-shrink: 0;
    border-radius: 20px;
    overflow: hidden;
  }

  .banner {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 20px;
  }

  .receipt-spacer { flex: 1; }

  /* Bottom bar */
  .bottom-bar {
    flex-shrink: 0;
    padding: 16px 12px calc(var(--safe-bottom) + 28px);
  }

  .bottom-bar-inner {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .home-btn {
    flex: 1;
    min-height: 56px;
    border: none;
    border-radius: 18px;
    background: linear-gradient(180deg, #2088fc 0%, #1270e8 100%);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
    box-shadow: 0 6px 18px rgba(18, 112, 232, 0.28);
    cursor: pointer;
  }

  .share-btn {
    width: 56px;
    height: 56px;
    border: none;
    border-radius: 18px;
    background: var(--share-bg);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }

  .share-btn svg {
    width: 22px;
    height: 22px;
    stroke: var(--blue);
    stroke-width: 2.2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ─── EDITOR SCREEN ─── */
  .edit-shell {
    display: flex;
    flex-direction: column;
    min-height: 100svh;
  }

  .edit-panel {
    margin: 8px 12px 0;
    background: #fff;
    border-radius: 24px;
    padding: 20px 18px 22px;
  }

  .editor-title {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  .editor-subtitle {
    font-size: 14px;
    line-height: 1.45;
    color: #7a8794;
    margin-bottom: 20px;
  }

  .field {
    margin-bottom: 14px;
  }

  .field:last-of-type { margin-bottom: 0; }

  .field label {
    display: block;
    margin-bottom: 7px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #8090a0;
  }

  .field input {
    width: 100%;
    min-height: 52px;
    padding: 0 16px;
    border: 1.5px solid #e7eaf0;
    border-radius: 16px;
    background: #fbfcfd;
    color: var(--text);
    font-size: 18px;
    outline: none;
    font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .field input:focus {
    border-color: #8dbdff;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.10);
  }

  .editor-actions {
    padding: 16px 12px 8px;
  }

  .generate-btn {
    width: 100%;
    min-height: 58px;
    border: none;
    border-radius: 20px;
    background: #0d2645;
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: -0.01em;
    transition: opacity 0.1s;
  }

  .generate-btn:active { opacity: 0.88; }

  .preview-note {
    padding: 0 14px 24px;
    font-size: 13px;
    line-height: 1.45;
    color: #9aa3ae;
    text-align: center;
  }

  /* ─────────── SECOND SCREEN / MOBILE REFINEMENT ─────────── */
  :root { color-scheme: light; }
  html,body { touch-action: pan-y; overscroll-behavior-x: none; }
  button { font-family: inherit; }
  button:focus-visible { outline: 3px solid #7ab8ff; outline-offset: 3px; }
  .receipt-shell .top-bar {
    min-height: calc(var(--safe-top) + 61px);
    padding-top: calc(var(--safe-top) + 8px);
    padding-bottom: 18px;
  }
  .receipt-shell .back-btn { left: 11px; bottom: 17px; width: 34px; height: 34px; box-shadow: none; }
  .receipt-shell .back-btn svg { width: 20px; height: 20px; }
  .receipt-body { padding: 7px 11px 0; }
  .receipt-card { position: relative; border-radius: 24px; isolation: isolate; }
  .receipt-top { padding: 12px 15px 0; }
  .status-circle {
    width: 48px;
    height: 48px;
    margin: 0 auto 7px;
    background: #20c75c;
    box-shadow: 0 0 0 3px rgba(32, 199, 92, .25);
  }
  .status-circle svg { width: 27px; height: 27px; stroke-width: 2.8; }
  .status-text { font-size: 16px; line-height: 20px; font-weight: 500; margin-bottom: 8px; letter-spacing: -0.01em; }
  .amount-row { gap: 4px; margin-bottom: 6px; }
  .amount { font-size: 32px; line-height: 34px; font-weight: 700; letter-spacing: -.045em; }
  .currency { font-size: 19px; line-height: 1; top: 1px; color: #8998a9; }
  .fee-row { font-size: 14px; line-height: 18px; margin-bottom: 0; color: #8f9dac; }
  .tear-row { height: 18px; margin-top: 2px; }
  .tear-line {
    height: 1px;
    margin: 0 27px;
    background-image: repeating-linear-gradient(90deg, #d6dce3 0, #d6dce3 5px, transparent 5px, transparent 11px);
  }
  .tear-cut { width: 37px; height: 37px; }
  .tear-cut.left { left: -18.5px; }
  .tear-cut.right { right: -18.5px; }
  .receipt-bottom { padding: 8px 18px 14px; }
  .trx-number { font-size: 17px; line-height: 21px; margin-bottom: 3px; }
  .trx-source { font-size: 15px; line-height: 19px; margin-bottom: 2px; }
  .trx-date { font-size: 14px; line-height: 18px; }
  .details-wrap { padding: 14px 0 18px; }
  .details-btn { min-height: 34px; padding: 0 15px; gap: 6px; font-size: 13px; box-shadow: none; }
  .details-btn svg { width: 13px; height: 13px; transition: transform .2s ease; }
  .details-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
  .banner-wrap, .banner { border-radius: 15px; }
  .banner { aspect-ratio: 1029/288; object-fit: cover; }
  .bottom-bar { padding: 14px 12px max(22px, calc(var(--safe-bottom) + 4px)); }
  .bottom-bar-inner { gap: 10px; }
  .home-btn, .share-btn { height: 48px; min-height: 48px; border-radius: 14px; }
  .home-btn { font-size: 14px; background: #0780fb; box-shadow: 0 2px 4px rgba(0,109,240,.16); }
  .share-btn { width: 48px; background: #e1ebf9; }
  .share-btn svg { width: 20px; height: 20px; }
  /* Permanent demo markings distinguish this preview from proof of a real transaction. */
  .receipt-card::after {
    position: absolute;
    left: 50%; top: 49%;
    transform: translate(-50%, -50%) rotate(-23deg);
    font-size: clamp(44px, 13vw, 70px);
    font-weight: 900;
    letter-spacing: .11em;
    color: rgba(12, 43, 81, .13);
    z-index: 3;
    pointer-events: none;
    white-space: nowrap;
  }
  .demo-label {
    position: absolute;
    right: 9px;
    top: 8px;
    padding: 3px 6px;
    border: 1px solid #cbd4de;
    border-radius: 7px;
    font-size: 9px;
    letter-spacing: .025em;
    font-weight: 700;
    color: #657487;
    z-index: 5;
    pointer-events: none;
  }
  .demo-notice {
    margin: 10px 0 0;
    color: #7f8d9c;
    font-size: 10px;
    line-height: 1.3;
    text-align: center;
  }
  .details-panel {
    display: none;
    margin: -4px 0 16px;
    border-radius: 17px;
    background: #fff;
    padding: 14px 16px;
    font-size: 13px;
  }
  .details-panel[aria-hidden="false"] { display: block; }
  .details-panel .detail-item { display:flex; justify-content: space-between; align-items: baseline; gap: 18px; padding: 5px 0; }
  .details-panel .detail-item span:first-child { color: #7f8b9a; }
  .details-panel .detail-item span:last-child { text-align: right; overflow-wrap: anywhere; }
  .toast { display: none; position: fixed; bottom: calc(var(--safe-bottom) + 96px); left:50%; transform:translateX(-50%); max-width:85vw; border-radius: 99px; padding: 9px 16px; font-size:13px; line-height:1.3; white-space:nowrap; text-align:center; color: #fff; background: #17344f; z-index:50; }
  .toast.visible { display:block; }
  @media (max-height: 680px) {
    .receipt-shell .top-bar { padding-bottom: 10px; min-height: calc(var(--safe-top) + 52px); }
    .details-wrap { padding-top: 10px; padding-bottom: 12px; }
    .receipt-shell .bottom-bar { padding-top: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .details-btn svg, .field input { transition: none; }
  }
</style>
</head>

  <div class="phone-shell edit-shell">
    <div class="top-bar">
      <button class="back-btn" type="button" aria-label="Назад">

      </button>

        <path d="m231 20.13h8.77v39.61h-8.77v-39.61z" fill="#004EA2"/>
      </svg>
    </div>

    <div class="edit-panel">
      <div class="editor-title">Редактор чека</div>

      <div class="field">
        <label for="inp-num">Номер транзакции</label>
        <input id="inp-num" type="text" inputmode="numeric" value="154" />
      </div>

      <div class="field">
        <label for="inp-sum">Сумма</label>
        <input id="inp-sum" type="text" inputmode="decimal" value="17" />
      </div>

      <div class="field">
        <label for="inp-date">Дата и время</label>
        <input id="inp-date" type="text" value="Автоматически" readonly />
      </div>
    </div>

    <div class="editor-actions">
      <button class="generate-btn" type="button" onclick="generateReceipt()">Предпросмотр макета</button>
    </div>

    <div class="preview-note">Для полноэкранного вида на iPhone открывайте со страницы «На экран Домой».</div>
  </div>
</div>

<!-- ═══ RECEIPT SCREEN ═══ -->
<div id="receipt-screen" class="screen" style="display:none;">
  <div class="phone-shell receipt-shell">
    <div class="top-bar">
      <button class="back-btn" type="button" onclick="backToEditor()" aria-label="Назад">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

          <div class="status-circle">
            <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"></path></svg>

            <span id="out-sum" class="amount">17</span>
            <span class="currency">с</span>
          </div>
          <div class="fee-row">Fee <strong>0</strong> <span class="fee-currency">с</span></div>

          <span class="tear-cut left"></span>
          <span class="tear-line"></span>
          <span class="tear-cut right"></span>

        <div class="receipt-bottom">
          <div id="out-num" class="trx-number">154</div>
          <div class="trx-source">By QR code <span id="out-qr">154</span></div>
          <div id="out-date" class="trx-date">02.04.2026 19:06:11</div>
        </div>
      </section>

      <div class="details-wrap">
        <button class="details-btn" type="button" id="details-btn" aria-expanded="false" aria-controls="details-panel" onclick="toggleDetails()">
          Transaction details

            <path d="M6 9l6 6 6-6"></path>

        </button>
      </div>

        <div class="detail-item"><span>Номер (образец)</span><span id="detail-num">154</span></div>
        <div class="detail-item"><span>Сумма (образец)</span><span id="detail-sum">17 с</span></div>
        <div class="detail-item"><span>Статус</span><span>Демонстрация</span></div>
      </div>

          src="https://cdn.bakai.kg/uploads/widgets/ufc%201029x288%20eng.webp"

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
  function getCurrentDateTime() {
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    return `${pad(now.getDate())}.${pad(now.getMonth()+1)}.${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  }

  function sanitize(value, fallback) {
    const t = String(value || '').trim();
    return (t === '' || t === 'Автоматически') ? fallback : t;
  }

  function generateReceipt() {
    const number = sanitize(document.getElementById('inp-num').value, '154');
    const sum    = sanitize(document.getElementById('inp-sum').value, '17');

    document.getElementById('out-num').textContent  = number;
    document.getElementById('out-qr').textContent   = number;
    document.getElementById('out-sum').textContent  = sum;
    document.getElementById('out-date').textContent = getCurrentDateTime();
    document.getElementById('detail-num').textContent = number;
    document.getElementById('detail-sum').textContent = sum + ' с';
    document.getElementById('details-btn').setAttribute('aria-expanded','false');
    document.getElementById('details-panel').setAttribute('aria-hidden','true');

    document.getElementById('editor-screen').style.display  = 'none';
    document.getElementById('receipt-screen').style.display = 'block';
    window.scrollTo(0, 0);
  }

  function backToEditor() {
    document.getElementById('receipt-screen').style.display = 'none';
    document.getElementById('editor-screen').style.display  = 'block';
    window.scrollTo(0, 0);
  }

  function toggleDetails() {
    const btn = document.getElementById('details-btn');
    const panel = document.getElementById('details-panel');
    const expanded = btn.getAttribute('aria-expanded') === 'true';
    btn.setAttribute('aria-expanded', String(!expanded));
    panel.setAttribute('aria-hidden', String(expanded));
  }
  
  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('visible');
    clearTimeout(window._toastTimeout);
    window._toastTimeout = setTimeout(() => toast.classList.remove('visible'), 2600);
  }
</script>
</body>
</html>
